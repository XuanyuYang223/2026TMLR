name: Saved representation research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  saved-table-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Standard-library fixture and saved-table check (no models)
        run: |
          python -B tools/recompute_tables.py --self-test
          python -B tools/recompute_tables.py --repo-root . --output "$RUNNER_TEMP/representation-table-check.json"
